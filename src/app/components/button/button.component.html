<button class="btn app-button" [class]="buttonClasses()" [class.app-button--block]="block()" [class.app-button--icon-only]="isIconOnly()"
  [class.app-button--loading]="loading()" [type]="type()" [disabled]="disabled() || loading()" [name]="name()" [value]="value()"
  [attr.form]="form() || null" [attr.title]="showTitle() ? resolvedTitle() : null" [attr.aria-label]="resolvedAriaLabel()" [attr.aria-busy]="loading()" (click)="onClick($event)">
  @if (loading()) {
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
  } @else if (resolvedIcon()) {
    <span class="app-button__icon" [class]="resolvedIcon()" aria-hidden="true"></span>
  }
  @if (resolvedText() && !isIconOnly()) { <span>{{ resolvedText() }}</span> }
</button>
