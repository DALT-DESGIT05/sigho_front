
<div
  class="card shadow-css p-2 card-custom"
  [class.card-custom--reserva]="variant() === 'reserva'"
  [class.card-custom--elevacion]="elevacion()"
  [class.card-custom--clickable]="useClick()"
  routerLinkActive="active"
  [routerLink]="!useClick() ? routerLink() : null"
  (click)="onCardClick()">

  <div
    class="card-body d-flex flex-column flex-md-row align-items-center justify-content-center text-center">

    <div
      class="col-12 col-md-6 mb-3 mb-md-0 d-flex justify-content-center align-items-center">

      <img
        [src]="imageSrc()"
        class="card-img img-fluid img-custom-ipress"
        [alt]="altText()">

    </div>

    <div
      class="col-12 col-md-6 d-flex flex-column justify-content-center align-items-center">

      <span class="span-color fs-6 text-center">
        {{ title() }}
      </span>

    </div>

  </div>

  @if (mostrarSeleccionar()) {
    <div class="card-custom__seleccionar">
      Seleccionar &rarr;
    </div>
  }

</div>
