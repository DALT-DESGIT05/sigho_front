<div class="card shadow-css p-2 card-custom" routerLinkActive="active"
  [routerLink]="!useClick() ? routerLink() : null" (click)="onCardClick()">
  <div class="card-body d-flex flex-column align-items-center justify-content-center">
    <img [src]="imageSrc()" class="card-img img-custom" [alt]="altText()">
    <span class="mt-2 span-color">{{ title() }}</span>
  </div>
</div>
