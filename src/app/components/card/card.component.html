<div
  class="card shadow-css p-2 card-custom"
  [class.card-custom--modalidad]="variant() === 'modalidad'"
  [class.card-custom--clickable]="useClick()"
  [class.card-custom--elevacion]="elevacion()"
  routerLinkActive="active"
  [routerLink]="!useClick() ? routerLink() : null"
  (click)="onCardClick()">

  <div class="card-body d-flex flex-column align-items-center justify-content-center">

    <img
      [src]="imageSrc()"
      class="card-img img-custom"
      [alt]="altText()">

    <span class="mt-2 span-color">{{ title() }}</span>

    @if (mostrarSeleccionar()) {
      <span class="card-custom__seleccionar">
        Seleccionar &rarr;
      </span>
    }

  </div>
</div>
