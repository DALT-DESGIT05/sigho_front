<div class="row g-2">
  @for (horario of horarios(); track horario.hora) {
    <div class="col-3">
      <app-horario-button
        [horario]="horario"
        [disabled]="disabled()"
        [loading]="hora_cargando() === horario.hora"
        (horario_seleccionado)="seleccionar_horario($event)"
      />
    </div>
  }
</div>
