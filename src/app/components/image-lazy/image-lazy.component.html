@if (cargando()) {
  <div class="image-skeleton" aria-label="Cargando imagen" role="status"></div>
} @else if (!error()) {
  <img [src]="imagenUrl() | imagen" [alt]="alt()" [class]="imageClass()" [style.object-fit]="objectFit()" (error)="cargarFallback()" />
} @else {
  <img [src]="fallbackSrc() | imagen" [alt]="alt()" [class]="imageClass()" [style.object-fit]="objectFit()" />
}
