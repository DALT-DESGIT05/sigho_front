<div
  class="form-check app-radio"
  [class]="'form-check app-radio app-radio--' + color() + ' app-radio--' + size()">
    <input
    class="form-check-input" type="radio"
    [id]="id()" [name]="name()"
    [value]="value() ?? ''"
    [checked]="isChecked()"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.aria-label]="ariaLabel() || visibleLabel() || null" (change)="handleChange($event)" (blur)="handleBlur()">

   @if (visibleLabel()) {
      <label class="form-check-label" [for]="id()">{{ visibleLabel() }}</label> }

</div>
