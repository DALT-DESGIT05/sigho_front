<div class="app-select" [class.is-open]="isOpen()" [class.is-disabled]="isDisabled()" [class.is-invalid]="hasError()" [class.has-floating-label]="useFloatingLabel()" [class.size-xs]="size() === 'xs'" [class.size-sm]="size() === 'sm'" [class.size-lg]="size() === 'lg'">
  @if (showExternalLabel()) { <app-label class="text-truncate" [texto]="visibleLabel()" [title]="label_title()" [forId]="id()" [required]="required()" [color]="color()" [size]="size() === 'xs' ? 'sm' : 'md'" (click)="on_label_click($event)"></app-label> }
  @if (useFloatingLabel()) { <label class="app-select__floating-label" [for]="id()">{{ visibleLabel() }}</label> }
  <button type="button" class="select-trigger" [id]="id() || null" [disabled]="isDisabled()" [attr.aria-expanded]="isOpen()" [attr.aria-label]="ariaLabel() || visibleLabel() || placeholder()" (click)="toggle()">
    @if (selectedOption(); as selected) {
      @if (selected.image) { <img class="select-image" [src]="selected.image | imagen" alt=""> } @else if (selected.icon) { <i class="select-icon" [class]="selected.icon" aria-hidden="true"></i> }
      <span class="select-text" [class]="'select-tone-' + (selected.tone || 'secondary')">{{ selected.label }}</span>
      @if (selected.count !== undefined && selected.count !== null) { <span class="select-count">{{ selected.count }}</span> }
    } @else { <span class="select-text">{{ placeholder() }}</span> }
    <i class="fa-solid fa-chevron-down select-chevron" aria-hidden="true"></i>
  </button>
  @if (isOpen()) {
    <div class="select-menu" role="listbox">
      @for (option of displayOptions(); track option.value) {
        <button type="button" class="select-option" [class.is-selected]="selectedOption()?.value === option.value" [class.is-disabled]="option.disabled" [disabled]="option.disabled" (click)="select(option)">
          @if (option.image) { <img class="select-image" [src]="option.image | imagen" alt=""> } @else if (option.icon) { <i class="select-icon" [class]="option.icon" aria-hidden="true"></i> }
          <span class="select-option-content"><span [class]="'select-option-label select-tone-' + (option.tone || 'secondary')">{{ option.label }}</span>@if (option.detail) { <small [class]="'select-detail select-detail--' + detailColor()">{{ option.detail }}</small> }</span>
          @if (option.count !== undefined && option.count !== null) { <span class="select-count">{{ option.count }}</span> }
        </button>
      } @empty { <div class="select-empty">No hay opciones disponibles.</div> }
    </div>
  }
  @if (error()) { <div class="app-select__error">{{ error() }}</div> } @else if (helpText()) { <div class="app-select__help">{{ helpText() }}</div> }
</div>
