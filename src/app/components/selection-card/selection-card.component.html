<button
  type="button"
  class="selection-card"
  [class.selection-card--selected]="selected()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-pressed]="selected()"
  (click)="select()">
  <span class="selection-card__visual">
    @if (hasImage()) {
      <img class="selection-card__image" [src]="imageSrc()" [alt]="imageAlt()" />
    } @else if (hasIcon()) {
      <i class="selection-card__icon" [class]="icon()" aria-hidden="true"></i>
    }
  </span>
  <span class="selection-card__title">{{ title() }}</span>
</button>
