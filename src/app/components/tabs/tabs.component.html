
@if (variant() === 'stepper' || variant() === 'stepper-line') {

  <nav class="app-stepper" [class.app-stepper--line]="variant() === 'stepper-line'" aria-label="Pasos del proceso">
    <ol class="app-stepper__list">
      @for (tab of tabs(); track tab.id; let i = $index) {
        <li class="app-stepper__item">
          <button
            type="button"
            class="app-stepper__button"
            [class.app-stepper__button--active]="tab.id === activeId()"
            [class.app-stepper__button--completed]="completedTabIds().includes(tab.id)"
            [disabled]="tab.disabled ?? false"
            [attr.aria-current]="tab.id === activeId() ? 'step' : null"
            (click)="selectTab(tab)"
          >
            <span class="app-stepper__number">
              @if (completedTabIds().includes(tab.id) && tab.id !== activeId()) {
                <i class="fa-solid fa-check" aria-hidden="true"></i>
              } @else {
                {{ i + 1 }}
              }
            </span>

            <span class="app-stepper__label">
              {{ tab.label }}
            </span>
          </button>
        </li>
      }
    </ol>
  </nav>

} @else {

  <ul class="nav nav-tabs flex-wrap" role="tablist">
    @for (tab of tabs(); track tab.id) {
      <li class="nav-item" role="presentation">
        <button
          type="button"
          class="nav-link"
          role="tab"
          [id]="'tab-' + tab.id"
          [class.active]="tab.id === activeId()"
          [disabled]="tab.disabled ?? false"
          [attr.aria-selected]="tab.id === activeId()"
          [attr.aria-disabled]="tab.disabled ?? false"
          (click)="selectTab(tab)"
        >
          {{ tab.label }}
        </button>
      </li>
    }
  </ul>

}
