<app-modal #modal titulo="Actualizar correo" [keyboard]="false" [ignoreBackdropClick]="true" [showCloseButton]="false" [showFooter]="true">
  <label class="form-label" for="correo-paciente">Correo</label>
  <input
    id="correo-paciente"
    type="email"
    class="form-control"
    autocomplete="email"
    [formField]="correo_form.correo">

  <div modal-footer class="d-flex gap-2">
    <app-button action="save" size="sm" [loading]="isSaving()" [disabled]="isCompleted() || isSaving()" (clicked)="btn_save()"></app-button>
    <app-button action="close" size="sm" (clicked)="close_modal()"></app-button>
  </div>
</app-modal>
