<app-modal #modal titulo="Actualizar teléfono" [keyboard]="false" [ignoreBackdropClick]="true" [showCloseButton]="false" [showFooter]="true">
  <label class="form-label" for="telefono-paciente">Teléfono</label>
  <input
    id="telefono-paciente"
    type="tel"
    class="form-control"
    autocomplete="tel"
    [formField]="telefono_form.telefono">

  <div modal-footer class="d-flex gap-2">
    <app-button action="save" size="sm" [loading]="isSaving()" [disabled]="isCompleted() || isSaving()" (clicked)="btn_save()"></app-button>
    <app-button action="close" size="sm" (clicked)="close_modal()"></app-button>
  </div>
</app-modal>
