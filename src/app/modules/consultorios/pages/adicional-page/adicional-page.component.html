
<!-- DATOS DE CONSULTA -->
<app-card-general
  class="adicional__consulta"
  titulo="Datos de Consulta"
  bodyClass="py-3 px-3">

  <div class="row g-2 align-items-end">

    <!-- AUTOCOMPLETE -->
    <div class="col-12 col-lg-7">
      <app-auto-complete
        label="BUSCAR PACIENTE"
        placeholder="Historia clínica, DNI, nombres o apellidos..."
        [dataSource]="buscarPacientes"
        [displayWith]="mostrarPaciente"
        [minLength]="2"
        [debounceTime]="300"
        [clearable]="true"
        [formControl]="pacienteControl"
        (optionSelected)="seleccionarPaciente($event)"
        (cleared)="limpiarPaciente()">
      </app-auto-complete>
    </div>

    <!-- BOTÓN CONSULTAR -->
    <div class="col-12 col-lg-auto">
      <app-button
        accion="search"
        [disabled]="!pacienteSeleccionado()"
        (clicked)="consultarPaciente()">
      </app-button>
    </div>

  </div>

</app-card-general>

<!-- INFORMACIÓN DEL PACIENTE -->
@if (datosPaciente(); as paciente) {

  <div class="mt-3">
    <app-patient-summary
      [patient]="paciente"
      [showDemographics]="true"
      [showPhone]="false"
      [showEmail]="false"
      [showDni]="false"
      [showStatus]="false"
      [showPaymentMethod]="false">
    </app-patient-summary>
  </div>



  <!-- DATOS DEL CONSULTORIO -->
  <div class="mt-3">

    <app-card-general
      class="adicional__consultorio"
      titulo="Datos del Consultorio"
      bodyClass="py-3 px-3">

      <div class="row g-2 align-items-end"
          [formGroup]="consultorioForm">

        <!-- CONSULTORIO -->
        <div class="col-12 col-lg-5">
          <app-select
            label="CONSULTORIO"
            placeholder="Seleccione consultorio"
            [options]="consultorios()"
            formControlName="consultorio"
            size="sm">
          </app-select>
        </div>

        <!-- ACTIVIDAD MÉDICA -->
        <div class="col-12 col-lg-5">
          <app-select
            label="ACTIVIDAD MÉDICA"
            placeholder="Seleccione actividad médica"
            [options]="actividadesMedicas()"
            formControlName="actividad_medica"
            size="sm">
          </app-select>
        </div>

        <!-- CONSULTAR -->
        <div class="col-12 col-lg-2 d-flex justify-content-end">
          <app-button
            accion="search"
            [disabled]="consultorioForm.invalid ||
                        !consultorioForm.value.consultorio ||
                        !consultorioForm.value.actividad_medica"
            (clicked)="consultarProgramacion()">
          </app-button>
        </div>

      </div>

    </app-card-general>

  </div>

}

  <app-modal-programacion-adicional
    #modalProgramacion
    [consultorio]="nombreConsultorio"
    [actividadMedica]="nombreActividadMedica">
  </app-modal-programacion-adicional>
