
<app-card-general
  class="programacion-medicos__filtros"
  titulo="Datos de Consulta"
  bodyClass="py-2 px-3">

  <form
    [formGroup]="filtrosForm"
    (ngSubmit)="consultar()">

    <div class="row g-2">

      <!-- CONSULTORIOS -->
      <div class="col-12 col-md-6 col-xl-3">
        <app-select
          label="ESPECIALIDADES"
          placeholder="-- Seleccione consultorio --"
          [options]="especialidades()"
          formControlName="especialidad"
        />
      </div>

      <!-- MÉDICOS -->
      <div class="col-12 col-md-6 col-xl-3">
        <app-select
          label="MÉDICOS"
          placeholder="-- Seleccione médico --"
          [options]="medicos()"
          formControlName="medico"
        />
      </div>

      <!-- FECHA INICIO -->
      <div class="col-12 col-md-6 col-xl-3">
        <app-input-date
          label="FECHA INICIO"
          type="date"
          [fechaCompacta]="true"
          formControlName="fecha_inicio"
        />
      </div>

      <!-- FECHA TÉRMINO -->
      <div class="col-12 col-md-6 col-xl-3">
        <app-input-date
          label="FECHA TÉRMINO"
          type="date"
          [fechaCompacta]="true"
          formControlName="fecha_termino"
        />
      </div>

      <!-- BOTÓN CONSULTAR -->
      <div class=" d-flex justify-content-end mt-2">
        <app-button
          accion="search"
          type="submit"
        />
      </div>

    </div>

  </form>

</app-card-general>

<div class="mt-3 programacion-medicos__resultados">
  <app-card-general
    titulo="Consulta de programación del Médico"
    bodyClass="p-2">

    <div card-header-actions>
     @if (consultaRealizada()){
        <app-button
          icon="fa-solid fa-plus"
          color="primary"
          variant="outline"
          outlineHover="border"
          clases="bg-white"
          size="sm"
          title="Agregar programación"
          (clicked)="abrirModalProgramacion()">
        </app-button>
      }
    </div>

    <div class="programacion-medicos__tabla">
      <app-table
        [columns]="columnasProgramacion"
        [rows]="programaciones()"
        [actions]="accionesProgramacion"
        scrollHeight="auto"
        size="sm"
        emptyMessage="No se encontraron programaciones para el médico seleccionado."
        (action)="onAccionProgramacion($event)">
      </app-table>
    </div>

  </app-card-general>
</div>

<app-modal
  #modalProgramacion
  titulo="Registrar Programación"
  icon="fa-solid fa-calendar-plus"
  size="md"
  [centered]="true"
  [fitContent]="true"
  [ignoreBackdropClick]="true"
  [showFooter]="true">

  <div class="programacion-medicos__modal">

    <form [formGroup]="registroForm" class="programacion-medicos__modal">

      <div class="row g-3">

        <!-- INFORMACIÓN DEL MÉDICO -->
        <div class="col-12">
          <div class="programacion-medicos__info">
            <div class="row g-2">
              <div class="col-6">
                  <app-label texto="especialidad"></app-label>
                <div>{{ obtenerNombreEspecialidad() }}</div>
              </div>

              <div class="col-6">
                <app-label texto ="Médico"> </app-label>
                <div>{{ obtenerNombreMedico() }}</div>
              </div>
            </div>
          </div>
        </div>

        <!-- FECHAS -->
        <div class="col-12 col-md-6">
          <app-input-date
            label="Fecha Incio"
            [required]="true"
            type="date"
            [fechaCompacta]="true"
            formControlName="fecha_inicio"
          />
        </div>

        <div class="col-12 col-md-6">
          <app-input-date
            label="Fecha Termino"
            [required]="true"
            type="date"
            [fechaCompacta]="true"
            formControlName="fecha_termino"
          />
        </div>

        <!-- ACTIVIDAD MÉDICA -->
          <div class="col-12">
            <app-select
              label="Actividad Medica"
              [required]="true"
              placeholder="-- Seleccione actividad médica --"
              [options]="actividadesMedicas()"
              formControlName="actividad_medica"
            />
          </div>

          <!-- PROGRAMA -->
          <div class="col-12 col-md-6">
            <app-select
              label="Programa"
              [required]="true"
              placeholder="-- Seleccione programa --"
              [options]="programas()"
              formControlName="programa"
            />
          </div>

          <!-- TURNO -->
          <div class="col-12 col-md-6">
            <app-select
              label="Turno"
              [required]="true"
              placeholder="-- Seleccione turno --"
              [options]="turnos()"
              formControlName="turno"
            />
          </div>
          <!-- HORARIO Y CUPOS -->
              <div class="col-12">
                <div class="row g-3">

                  <!-- HORA INICIO -->
                  <div class="col-12 col-md-4">
                    <app-input-text
                      label="Hora Inicio"
                      type="time"
                      formControlName="hora_inicio">
                    </app-input-text>
                  </div>

                  <!-- HORA TÉRMINO -->
                  <div class="col-12 col-md-4">
                    <app-input-text
                      label="Hora Término"
                      type="time"
                      formControlName="hora_termino">
                    </app-input-text>
                  </div>

                  <!-- CUPOS -->
                    <div class="col-12 col-md-4">
                      <app-label texto="Cupos"></app-label>

                      <div class="mt-2">
                        <span class="badge programacion-medicos__cupos">
                          {{ registroForm.controls.cupos.value }}
                        </span>
                      </div>
                    </div>

                </div>
              </div>

      </div>

    </form>

  </div>

  <div modal-footer class="d-flex justify-content-between w-100">
    <app-button
      accion="cancel"
      (clicked)="cerrarModalProgramacion()">
    </app-button>

    <app-button
      accion="save"
      [disabled]="!puedeGuardarProgramacion()"
      (clicked)="guardarProgramacion()">
    </app-button>
  </div>

</app-modal>
<app-alert-dialog #alertaProgramacion />
